# Pilot analysis plan (EXAM05). Thresholds remain UNAPPROVED initial values.
version: pilot_analysis_v1
created_at: "2026-10-26T00:00:00Z"
approval_status: DRAFT_UNAPPROVED

endpoint:
  primary: paired_physical_auc_difference_of_selected_models
  baseline: S_real_same_budget
  candidate: S_dig
  direction: positive_means_candidate_better
  secondary: [absolute_regret, selected_model_frequencies, near_optimal_membership, cost]

thresholds:
  delta_auc: 0.01
  epsilon_auc: 0.01
  confidence_level: 0.95
  primary_budget_groups: 40
  secondary_budgets: [20, 80]

resampling:
  unit: split_group_id
  paired: true
  replays_requested: 200
  bootstrap_replicates: 2000
  seed: 20261026
  report_unique_subsets: true
  label_when_only_resampling_T: conditional_on_calibration_pool

multiplicity:
  family_defined_at: EXAM06
  candidate_method: bonferroni_over_K_primary_comparisons
  k: null

interpretation:
  substantial_gain: lower_ci_bound_gt_delta
  substantial_loss: upper_ci_bound_lt_minus_delta
  equivalent_at_scale: lower_ge_minus_epsilon_and_upper_le_epsilon
  directional_only: interval_crosses_zero_but_not_delta_regions
  otherwise: INCONCLUSIVE

reporting:
  pilot_label: PILOT
  reveal_requires: frozen_choices
  cannot_be_renamed_as_confirmatory: true
