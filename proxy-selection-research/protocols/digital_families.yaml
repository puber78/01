# Digital test families used as proxy evidence.
# 3-4 families are registered before scoring; parameters below are PROPOSED and
# must be frozen at EXAM03 before any digital score is written. They must never
# be tuned on T_pilot.
version: digital_families_v1
created_at: "2026-10-26T00:00:00Z"
approval_status: DRAFT_UNAPPROVED
freeze_stage: EXAM03

aggregation:
  primary: equal_weight_mean_of_family_auc
  auxiliary: [worst_family, single_family]
  note: digital family AUC aggregation is not pooled-AUC over mixed images

families:
  - id: F1_jpeg
    kind: encode
    parameters: {format: jpeg, quality: 75, subsampling: "4:2:0"}
  - id: F2_scale
    kind: rescale
    parameters: {downscale: 0.5, upsample: bilinear, output_size: original}
  - id: F3_blur
    kind: blur
    parameters: {kernel: gaussian, sigma: 0.8}
  - id: F4_color
    kind: color
    parameters: {saturation: 1.2, brightness: 0.95, contrast: 1.05}

execution_contract:
  deterministic: true
  seed: 20261026
  saved_versions: true
  clean_baseline_also_scored: true
